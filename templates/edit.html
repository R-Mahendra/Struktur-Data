<!doctype html>
<html>
  <head>
    <title>Edit Task</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="card p-4 shadow">
        <h1>Edit Task</h1>

        <form method="POST" class="row g-3">
          <div class="col-md-12">
            <input
              type="text"
              class="form-control"
              name="nama"
              value="{{ task[0] }}"
              gvhgvhh
              required
            />
          </div>

          <div class="col-md-4">
            <select name="kategori" class="form-select">
              {% for k in kategori %}

              <option
                value="{{ k }}"
                {%
                if
                task[1]=="k"
                %}
                selected
                {%
                endif
                %}
              >
                {{ k }}
              </option>

              {% endfor %}
            </select>
          </div>

          <div class="col-md-4">
            <input
              type="date"
              class="form-control"
              name="tanggal"
              value="{{ task[2] }}"
              required
            />
          </div>

          <div class="col-md-4">
            <select name="priority" class="form-select">
              <option
                value="Low"
                {%
                if
                task[4]=="Low"
                %}
                selected
                {%
                endif
                %}
              >
                Low
              </option>

              <option
                value="Medium"
                {%
                if
                task[4]=="Medium"
                %}
                selected
                {%
                endif
                %}
              >
                Medium
              </option>

              <option
                value="High"
                {%
                if
                task[4]=="High"
                %}
                selected
                {%
                endif
                %}
              >
                High
              </option>
            </select>
          </div>
          <div class="col-md-12">
            <textarea name="notes" class="form-control">{{ task[6] }}</textarea>
          </div>

          <div class="col-md-12">
            <button class="btn btn-primary">Update</button>

            <a href="/" class="btn btn-secondary"> Kembali </a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
